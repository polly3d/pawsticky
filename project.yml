name: PawIt
options:
  bundleIdPrefix: com.fitpetgo.pawsticky
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  Core:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PawIt:
    type: application
    platform: iOS
    sources:
      - PawIt
      - Shared
    dependencies:
      - package: Core
      - target: PawItWidget
      - target: PawItWatch
    entitlements:
      path: PawIt/PawIt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawIt/Info.plist
      properties:
        CFBundleDisplayName: PawSticky
        # XcodeGen 生成的 Info.plist 默认写死 1.0 / 1,必须显式引用构建设置,
        # 否则改 MARKETING_VERSION / CURRENT_PROJECT_VERSION 不生效。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky
  PawItWidget:
    type: app-extension
    platform: iOS
    sources:
      - PawItWidget
      - Shared
    dependencies:
      - package: Core
    entitlements:
      path: PawItWidget/PawItWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawItWidget/Info.plist
      properties:
        CFBundleDisplayName: PawSticky Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.widgets
        SKIP_INSTALL: true
  PawItWatch:
    type: application
    platform: watchOS
    sources:
      - PawItWatch
    dependencies:
      - package: Core
      - target: PawItWatchWidget
    entitlements:
      path: PawItWatch/PawItWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawItWatch/Info.plist
      properties:
        CFBundleDisplayName: PawSticky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.fitpetgo.pawsticky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.watchkitapp
  PawItWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - PawItWatchWidget
    dependencies:
      - package: Core
    entitlements:
      path: PawItWatchWidget/PawItWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawItWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: PawSticky Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.watchkitapp.widgets
        SKIP_INSTALL: true
  PawItTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PawItTests
    dependencies:
      - package: Core
      - target: PawIt   # W2 卡:宿主链接,App 层(ContentView/PawItApp)可测
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PawIt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PawIt
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PawIt:
    build:
      targets:
        PawIt: all
        PawItWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PawItTests
        - package: Core/CoreTests
  PawItWidget:
    build:
      targets:
        PawItWidget: all
  PawItWatch:
    build:
      targets:
        PawItWatch: all
