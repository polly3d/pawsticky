name: PawIt
options:
  bundleIdPrefix: com.fitpetgo.pawsticky
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  Core:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
# 签名团队来自本地 xcconfig（不入库）：见 Config/Base.xcconfig 与 Config/Signing.local.xcconfig.example。
# 没有本地文件时不影响构建；上架/真机调试前复制模板并填 Team ID 即可。
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  PawIt:
    type: application
    platform: iOS
    sources:
      - PawIt
      - Shared
    dependencies:
      - package: Core
      - target: PawItWidget
      - target: PawItWatch
    entitlements:
      path: PawIt/PawIt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawIt/Info.plist
      properties:
        CFBundleDisplayName: PawSticky
        # XcodeGen 生成的 Info.plist 默认写死 1.0 / 1,必须显式引用构建设置,
        # 否则改 MARKETING_VERSION / CURRENT_PROJECT_VERSION 不生效。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # v1.0 锁定浅色外观：AppTheme 的背景 / 气泡是固定亮色,文字却用随外观变化的 .primary,
        # 深色模式下欢迎页与列表文字会消失。v1.1 做完整深色主题后移除此行。
        # 只影响 App 本体;Widget / Live Activity / Watch 不受影响。
        UIUserInterfaceStyle: Light
        # 出口合规:加密只来自系统自带框架(CryptoKit AES-GCM / CommonCrypto PBKDF2,仅用于加密
        # 用户自己的导出备份文件),没有自实现算法,也没有网络通信加密。按"仅使用系统自带加密 → 豁免"
        # 口径声明为 false,上传时不再弹合规问卷。
        # ⚠ 这是对公司的合规声明,提审前请由公司确认;结论不同就改成 true 并按 ASC 问卷补材料。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky
        # v1.0 仅 iPhone(决议 #3):iPad 布局是被拉伸的手机界面,且声明支持 iPad 就必须提供 iPad 截图。
        # iPad 用户仍可在兼容模式下运行 iPhone App。
        TARGETED_DEVICE_FAMILY: "1"
  PawItWidget:
    type: app-extension
    platform: iOS
    sources:
      - PawItWidget
      - Shared
    dependencies:
      - package: Core
    entitlements:
      path: PawItWidget/PawItWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawItWidget/Info.plist
      properties:
        CFBundleDisplayName: PawSticky Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
  PawItWatch:
    type: application
    platform: watchOS
    sources:
      - PawItWatch
    dependencies:
      - package: Core
      - target: PawItWatchWidget
    entitlements:
      path: PawItWatch/PawItWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawItWatch/Info.plist
      properties:
        CFBundleDisplayName: PawSticky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.fitpetgo.pawsticky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.watchkitapp
  PawItWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - PawItWatchWidget
    dependencies:
      - package: Core
    entitlements:
      path: PawItWatchWidget/PawItWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitpetgo.pawsticky.shared
    info:
      path: PawItWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: PawSticky Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.watchkitapp.widgets
        SKIP_INSTALL: true
  PawItTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PawItTests
    dependencies:
      - package: Core
      - target: PawIt   # W2 卡:宿主链接,App 层(ContentView/PawItApp)可测
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitpetgo.pawsticky.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PawIt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PawIt
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PawIt:
    build:
      targets:
        PawIt: all
        PawItWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PawItTests
        - package: Core/CoreTests
  PawItWidget:
    build:
      targets:
        PawItWidget: all
  PawItWatch:
    build:
      targets:
        PawItWatch: all
